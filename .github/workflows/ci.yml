name: Validate WebHealth
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: webhealth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      DEPLOY_ACCOUNT: "111111111111"
      DEPLOY_REGION: us-east-2
      CDK_DISABLE_CLI_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dashboard client tests (95% line coverage gate)
        run: npm run test:dashboard
      - run: python -m pip install -r vshydzai/requirements-dev.txt
      - name: Lint
        run: ruff check vshydzai
      - name: Local tests and infrastructure assertions
        working-directory: vshydzai
        run: pytest -m "not integration" --cov=lambda_src --cov=scripts --cov-fail-under=85 --cov-report=term-missing --cov-report=json:test-results/coverage.json --junitxml=test-results/local.xml
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Browser demonstration checks
        env:
          DASHBOARD_PYTHON: python
        run: npm run test:browser
      - name: Synthesize all environments
        run: |
          npm run synth -- -c environment=beta --quiet --no-lookups
          npm run synth -- -c environment=gamma --quiet --no-lookups
          npm run synth -- -c environment=prod --quiet --no-lookups
      - name: Synthesize the three-stage pipeline
        env:
          CONNECTION_ARN: arn:aws:codestar-connections:us-east-2:111111111111:connection/00000000-0000-0000-0000-000000000000
        run: npm run synth:pipeline -- --quiet --no-lookups
      - name: Synthesize alternative deployment environments
        env:
          DEPLOY_REGION: ap-southeast-2
        run: |
          npm run synth:alias -- -c environment=beta --quiet --no-lookups
          npm run synth:alias -- -c environment=gamma --quiet --no-lookups
          npm run synth:alias -- -c environment=prod --quiet --no-lookups
      - name: Synthesize the alternative three-stage pipeline
        env:
          DEPLOY_REGION: ap-southeast-2
          CONNECTION_ARN: arn:aws:codeconnections:ap-southeast-2:111111111111:connection/00000000-0000-0000-0000-000000000000
        run: npm run synth:pipeline:alias -- --quiet --no-lookups
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webhealth-test-results
          path: |
            vshydzai/test-results/*.xml
            vshydzai/test-results/coverage.json
            test-results/
            playwright-report/
